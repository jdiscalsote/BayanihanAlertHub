name: Supabase Free-Tier Keep-Alive

on:
  schedule:
    # Runs twice a week (Monday and Thursday at 03:00 UTC) so Supabase Free Tier does not auto-pause after 7 days of inactivity.
    - cron: '0 3 * * 1,4'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "SUPABASE_URL or SUPABASE_ANON_KEY repository secret is not configured; skipping keep-alive ping."
            exit 0
          fi

          STATUS_CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
            "${SUPABASE_URL%/}/rest/v1/advisories?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          echo "Supabase keep-alive response status: ${STATUS_CODE}"
          if [ "$STATUS_CODE" -lt 200 ] || [ "$STATUS_CODE" -ge 300 ]; then
            echo "Supabase keep-alive ping failed with HTTP ${STATUS_CODE}"
            exit 1
          fi
